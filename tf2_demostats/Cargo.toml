[package]
name = "tf2_demostats"
edition = "2024"
version.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
num_enum = "0.7.6"
enumset = "1.1.14"
keyvalues-serde = "0.2.4"
merge = "0.2.0"
nalgebra = { version = "0.33.3", features = ["alga"] }
parry3d = "0.18.0"
alga = "0.9"
rapier3d = "0.23.1"
optfield = "0.4.0"
ustr = "1.1.0"
tf-demo-parser = "0.7.1"
steam-audio-codec = "0.1"
ogg = "0.9"
opus = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls-webpki-roots",
] }

[lints]
workspace = true
