[package]
name = "tf2_demostats_http"
edition = "2024"
version.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true
license.workspace = true

[features]
# Enable generated client stubs (`DemoServiceClient`) + client transports.
client = ["connectrpc/client"]

[dependencies]
axum = "0.8"
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
tf-demo-parser = "0.7.1"
tokio = { version = "1.53", features = ["net", "rt"] }
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tf2_demostats = { path = "../tf2_demostats" }

[build-dependencies]
connectrpc-build = "0.9"

# `serde` is only referenced by generated code in OUT_DIR (see `build.rs`),
# which cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["connectrpc-build", "serde"]

[dev-dependencies]
http = "1.5"
serde_json = "1.0"
tokio = { version = "1.53", features = ["fs", "macros", "rt-multi-thread"] }

[lints]
workspace = true
